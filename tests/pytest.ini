[pytest]
minversion = 7.0
testpaths = validate
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    docker: tests that require a working Docker daemon (skip with -m 'not docker')
    yamllint: tests that require the `yamllint` binary
    promtool: tests that require the `promtool` binary
