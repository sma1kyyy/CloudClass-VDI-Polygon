name: CI

on:
  push:
  pull_request:

# Чтобы новый push в ту же ветку отменял предыдущий запуск, а не копил очередь.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-config:
    name: docker configs (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/docker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/docker/requirements.txt

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Pre-pull Docker images
        run: |
          set -euo pipefail
          for img in \
            prom/prometheus:latest \
            prom/alertmanager:latest \
            balabit/syslog-ng:latest
          do
            echo "::group::pull $img"
            docker pull --quiet "$img" &
          done
          wait
          echo "::endgroup::"

      - name: Run tests/docker
        run: |
          pytest tests/docker/ -v --color=yes

