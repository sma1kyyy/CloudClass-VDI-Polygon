name: validate

on:
  workflow_call:

jobs:

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yamllint python3-yaml

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Pre-pull validator images
        run: |
          set -euo pipefail
          for img in \
            prom/prometheus:latest \
            prom/alertmanager:latest \
            balabit/syslog-ng:latest
          do
            echo "::group::pull $img"
            docker pull --quiet "$img" &
          done
          wait
          echo "::endgroup::"

      - name: Lint YAML (yamllint + PyYAML)
        run: bash tests/validate/docker/yaml.sh

      - name: Validate compose.yaml
        run: bash tests/validate/docker/compose.sh

      - name: Validate Prometheus config + rules
        run: bash tests/validate/docker/prometheus.sh

      - name: Validate Alertmanager config
        run: bash tests/validate/docker/alertmanager.sh

      - name: Validate syslog-ng config
        run: bash tests/validate/docker/syslog_ng.sh
