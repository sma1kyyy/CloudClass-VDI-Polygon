groups:
  - name: CloudClass-VDI-Alerts
    interval: 30s
    evaluation_delay: 1m
    
    rules:
      # ========== СЕРВИСЫ ==========
      
      - alert: GuacamoleDown
        expr: up{job="guacamole"} == 0
        for: 2m
        labels:
          severity: critical
          service: guacamole
        annotations:
          summary: "Guacamole недоступен!"
          description: "Web-портал Guacamole не отвечает. Студенты не могут подключиться к VDI."
          runbook: "Проверить контейнер: docker-compose ps guacamole, docker-compose logs guacamole"
      
      - alert: GuacdDown
        expr: up{job="guacd"} == 0
        for: 2m
        labels:
          severity: critical
          service: guacamole
        annotations:
          summary: "Guacd (демон) недоступен!"
          description: "Демон Guacamole (guacd) упал. Новые подключения RDP/SSH невозможны."
          runbook: "Перезапустить: docker-compose restart guacd"
      
      - alert: ProxmoxDown
        expr: up{job="proxmox"} == 0
        for: 2m
        labels:
          severity: critical
          service: proxmox
        annotations:
          summary: "Proxmox недоступен!"
          description: "Proxmox VE на ноутбуке 2 не отвечает на запросы."
          runbook: "SSH на 10.0.10.2, проверить systemctl status pvedaemon"
      
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Prometheus не доступен"
          description: "Сбор метрик остановлен. Grafana не получит новых данных."
          runbook: "Проверить контейнер: docker-compose restart prometheus"
      
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: warning
          service: monitoring
        annotations:
          summary: "Grafana недоступна"
          description: "Визуализация метрик недоступна, но сбор продолжается."
          runbook: "docker-compose restart grafana"
      
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL (БД Guacamole) упала"
          description: "Новые подключения к VDI невозможны (нет БД соединений)."
          runbook: "docker-compose restart postgres"
      
      # ========== ПАМЯТЬ ==========
      
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
          resource: memory
        annotations:
          summary: "{{ $labels.instance }} использует > 85% памяти"
          description: "Ноутбук {{ $labels.instance }} почти без памяти. Может произойти swap на SSD."
          runbook: "Проверить docker stats, может быть какой-то контейнер утёк памятью"
      
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.95
        for: 2m
        labels:
          severity: critical
          resource: memory
        annotations:
          summary: "{{ $labels.instance }} использует > 95% памяти!"
          description: "КРИТИЧНО! Ноутбук почти без памяти. Возможна потеря сессий студентов."
          runbook: "Немедленно остановить ненужные контейнеры или выключить что-то"
      
      # ========== CPU ==========
      
      - alert: HighCPUUsage
        expr: rate(node_cpu_seconds_total{mode="user"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          resource: cpu
        annotations:
          summary: "{{ $labels.instance }} использует > 80% CPU"
          description: "Ноутбук почти перегружен. Новые сессии студентов могут быть медленными."
          runbook: "Проверить что работает: top -b -n 1"
      
      # ========== ДИСК ==========
      
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          resource: disk
        annotations:
          summary: "Свободно < 15% дискового пространства на {{ $labels.instance }}"
          description: "Скоро закончится место на диске. Бэкапы могут перестать создаваться."
          runbook: "Проверить: df -h, удалить старые бэкапы или логи"
      
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 2m
        labels:
          severity: critical
          resource: disk
        annotations:
          summary: "Свободно < 5% дискового пространства!"
          description: "КРИТИЧНО! Диск почти полный. Контейнеры могут упасть или не запуститься."
          runbook: "СРОЧНО освободить место: rm -rf old-backups, docker system prune"
      
      # ========== СЕТЬ ==========
      
      - alert: HighNetworkTraffic
        expr: rate(node_network_transmit_bytes_total{device!="lo"}[5m]) > 10485760  # 10 Mbps
        for: 5m
        labels:
          severity: warning
          resource: network
        annotations:
          summary: "{{ $labels.instance }} передаёт > 10 Мбит/с"
          description: "Интерфейс {{ $labels.device }} перегружен трафиком. Может быть утечка данных или много VDI-сессий."
          runbook: "Проверить: iftop -n, может быть dummynet не работает"
      
      # ========== VDI СЕССИИ ==========
      
      - alert: LinuxVDIDown
        expr: up{instance="10.0.20.10:9100"} == 0
        for: 2m
        labels:
          severity: critical
          service: vdi
        annotations:
          summary: "Linux VDI недоступна (10.0.20.10)"
          description: "ВМ Linux VDI упала или сеть разорвалась. Студенты не могут подключиться."
          runbook: "Proxmox UI → проверить статус ВМ, может быть перезагрузить"
      
      - alert: WindowsVDIDown
        expr: up{instance="10.0.20.11:9100"} == 0
        for: 2m
        labels:
          severity: critical
          service: vdi
        annotations:
          summary: "Windows VDI недоступна (10.0.20.11)"
          description: "ВМ Windows VDI упала или сеть разорвалась."
          runbook: "Proxmox UI → проверить статус ВМ, перезагрузить"
      
      - alert: VDIHighLoad
        expr: node_load1{instance=~"10.0.2[01].*"} > 3
        for: 10m
        labels:
          severity: warning
          service: vdi
        annotations:
          summary: "VDI {{ $labels.instance }} перегружена (Load > 3)"
          description: "ВМ работает на пределе возможностей. Сессии могут быть медленными."
          runbook: "Может быть завершить пару неиспользуемых сессий или добавить CPU"
      
      # ========== NFS STORAGE ==========
      
      - alert: NFSMountFailed
        expr: node_nfs_requests_total == 0
        for: 5m
        labels:
          severity: critical
          service: storage
        annotations:
          summary: "NFS монтирование сломалось на {{ $labels.instance }}"
          description: "ВМ не может обращаться к NFS (профили пользователей недоступны)."
          runbook: "SSH на ноутбук, проверить: mount | grep nfs, может быть переподключить NFS"
      
      - alert: NFSHighLatency
        expr: rate(node_nfs_request_rtt_microseconds_total[5m]) > 100000
        for: 5m
        labels:
          severity: warning
          service: storage
        annotations:
          summary: "NFS медленно работает на {{ $labels.instance }} (latency > 100ms)"
          description: "Файловая система работает медленнее обычного. Возможна сетевая проблема."
          runbook: "Проверить ping до FreeBSD (10.0.40.1), может быть сетевой кабель"
      
      # ========== DOCKER STATS ==========
      
      - alert: ContainerRestarting
        expr: increase(container_last_seen{id=~".*guacamole.*"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Контейнер {{ $labels.name }} перезапускается"
          description: "Контейнер часто падает и перезапускается. Может быть ошибка в коде или нехватка памяти."
          runbook: "docker-compose logs {{ $labels.name }} | tail -100"
      
      - alert: DockerDiskUsageHigh
        expr: (container_fs_usage_bytes / container_fs_limit_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Docker контейнер {{ $labels.name }} занимает > 80% своего диска"
          description: "Контейнер может скоро не иметь места для записи."
          runbook: "docker system prune, или увеличить размер контейнера"
      
      # ========== GUACAMOLE CONNECTIONS ==========
      
      - alert: TooManyGuacamoleConnections
        expr: guacamole_active_connections > 50
        for: 5m
        labels:
          severity: warning
          service: guacamole
        annotations:
          summary: "Много одновременных подключений к Guacamole ({{ $value }})"
          description: "Более 50 студентов одновременно используют VDI. Может быть нагрузочный тест."
          runbook: "Смотреть метрики в Grafana, может быть всё нормально, но следить"

  # ========== ПРАВИЛА ДЛЯ ЗАПИСИ (RECORDING RULES) ==========
  
  - name: CloudClass-Recording-Rules
    interval: 15s
    rules:
      # Среднее использование памяти за час
      - record: instance:node_memory_utilization:ratio
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
      
      # Среднее использование CPU за 5 минут
      - record: instance:node_cpu_utilization:ratio
        expr: rate(node_cpu_seconds_total{mode="user"}[5m])
      
      # Скорость чтения с диска
      - record: instance:node_disk_read_rate:bytes_per_sec
        expr: rate(node_disk_read_bytes_total[5m])
      
      # Скорость записи на диск
      - record: instance:node_disk_write_rate:bytes_per_sec
        expr: rate(node_disk_written_bytes_total[5m])