global:
  resolve_timeout: 5m
  # SMTP настройки для отправки уведомлений на почту (опционально)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'
  # smtp_from: 'alerts@cloudclass.local'

# Определение маршрутов (куда отправлять уведомления)
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  
  # Подправила для разных типов alerts
  routes:
    # CRITICAL alerts идут немедленно
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 0s
      repeat_interval: 1h
    
    # WARNING alerts группируются
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 30s
      repeat_interval: 4h

# Получатели уведомлений
receivers:
  - name: 'default-receiver'
    # Webhook на локальный скрипт (может отправить Telegram, Slack и т.д.)
    webhook_configs:
      - url: 'http://localhost:5001/webhook'  # Твой скрипт для уведомлений
        send_resolved: true

  - name: 'critical-receiver'
    # Webhook для критических alert'ов
    webhook_configs:
      - url: 'http://localhost:5001/webhook/critical'
        send_resolved: true
    
    # ОПЦИОНАЛЬНО: Email
    # email_configs:
    #   - to: 'admin@cloudclass.local'
    #     headers:
    #       Subject: '⚠️ CRITICAL: {{ .GroupLabels.alertname }}'

  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/warning'
        send_resolved: true

# Ингибиция (подавление алертов)
inhibit_rules:
  # Не показывать WARNING если уже есть CRITICAL по тому же сервису
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']
  
  # Не спамить если хост вообще недоступен
  - source_match:
      alertname: 'TargetDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']