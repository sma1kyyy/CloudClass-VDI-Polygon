# ==============================================================
#  CloudClass -- Nginx Reverse Proxy
#  Host: 10.0.10.3
# ==============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    proxy_connect_timeout 10s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ==============================================================
    # Upstreams -- обращаемся по именам контейнеров внутри сети
    # ==============================================================

    upstream guacamole_backend {
        server guacamole:8080;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    upstream prometheus_backend {
        server prometheus:9090;
    }

    upstream portainer_backend {
        server portainer:9000;
    }

    upstream code_server_backend {
        server code-server:8443;
    }

    upstream alertmanager_backend {
    }

    upstream node_exporter_backend {
        server node-exporter:9100;
    }

    upstream cadvisor_backend {
        # cadvisor внутри слушает на 8080, снаружи проброшен на 8081
        server cadvisor:8080;
    }

    # ==============================================================
    # Virtual host
    # ==============================================================
    server {
        listen 80;
        server_name cloudclass;

        # --------------------------------------------------------------
        # Root -- навигация
        # --------------------------------------------------------------
        location = / {
            charset utf-8;
            default_type text/html;
            return 200 '<!DOCTYPE html>
                <html lang="ru">
                <head><meta charset="utf-8"><title>CloudClass</title></head>
                <body style="font-family: monospace; padding: 2em;">
                <h2>CloudClass -- Service Dashboard</h2>
                <ul>
                <li><a href="/guacamole/">Guacamole (VDI portal)</a></li>
                <li><a href="/grafana/">Grafana</a></li>
                <li><a href="/prometheus/">Prometheus</a></li>
                <li><a href="/portainer/">Portainer</a></li>
                <li><a href="/code-server/">code-server (VS Code)</a></li>
                <li><a href="/alertmanager/">Alertmanager</a></li>
                <li><a href="/node-exporter/metrics">Node Exporter (metrics)</a></li>
                <li><a href="/cadvisor/">cAdvisor</a></li>
                </ul>
                </body></html>';
        }

        # --------------------------------------------------------------
        # Guacamole
        # Приложение само ожидает prefix /guacamole/ -- передаём как есть
        # --------------------------------------------------------------
        location /guacamole/ {
            proxy_pass http://guacamole_backend/guacamole/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Grafana
        # GF_SERVER_ROOT_URL и GF_SERVER_SERVE_FROM_SUB_PATH заданы
        # в compose -- grafana сама знает что живёт на /grafana/
        # --------------------------------------------------------------
        location /grafana/ {
            proxy_pass http://grafana_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade          $http_upgrade;
            proxy_set_header Connection       "upgrade";
            proxy_set_header X-Forwarded-Host $host;
        }

        # --------------------------------------------------------------
        # Prometheus
        # --web.external-url и --web.route-prefix заданы в compose
        # --------------------------------------------------------------
        location /prometheus/ {
            proxy_pass http://prometheus_backend;

            allow 10.0.0.0/16;
            deny  all;
        }

        # --------------------------------------------------------------
        # Portainer
        # Живёт на корне -- обрезаем /portainer/ перед передачей
        # --------------------------------------------------------------
        location /portainer/ {
            proxy_pass http://portainer_backend/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --------------------------------------------------------------
        # code-server
        # DEFAULT_WORKSPACE задан в compose, BASE_PATH=/code-server
        # --------------------------------------------------------------
        location /code-server/ {
            proxy_pass http://code_server_backend/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Alertmanager
        # --web.external-url задан в compose
        # --------------------------------------------------------------
        location /alertmanager/ {
            proxy_pass http://alertmanager_backend;

            allow 10.0.0.0/16;
            deny  all;
        }

        # --------------------------------------------------------------
        # Node Exporter -- только /metrics, только внутренняя сеть
        # --------------------------------------------------------------
        location /node-exporter/ {
            proxy_pass http://node_exporter_backend/;

            allow 10.0.0.0/16;
            deny  all;
        }

        # --------------------------------------------------------------
        # cAdvisor
        # --------------------------------------------------------------
        location /cadvisor/ {
            proxy_pass http://cadvisor_backend/;

            allow 10.0.0.0/16;
            deny  all;
        }
    }
}