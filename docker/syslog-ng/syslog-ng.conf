@version: 4.2
@include "scl.conf"

options {
    time-reap(30);
    mark-freq(0);
    keep-hostname(yes);
    use-dns(no);
};

# Приём от Docker-контейнеров (UDP 514)
source s_udp {
    network(
        transport("udp")
        port(514)
        ip("0.0.0.0")
    );
};

# Приём по TCP 601
source s_tcp {
    network(
        transport("tcp")
        port(601)
        ip("0.0.0.0")
    );
};

# Запись всего в общий файл
destination d_all {
    file("/var/log/syslog-ng/syslog"
        template("${ISODATE} ${HOST} ${PROGRAM}: ${MESSAGE}\n")
    );
};

# Раздельные файлы по тегу (контейнеру)
destination d_containers {
    file("/var/log/syslog-ng/containers/${PROGRAM}.log"
        template("${ISODATE} ${HOST}: ${MESSAGE}\n")
        create-dirs(yes)
    );
};

log { source(s_udp); destination(d_all); destination(d_containers); };
log { source(s_tcp); destination(d_all); destination(d_containers); };