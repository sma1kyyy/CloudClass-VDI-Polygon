@version: 3.38
@include "scl.conf"

# ===================================
# SOURCES — откуда приёмём логи
# ===================================

# 1. Локальные логи (от самого Docker-контейнера)
source s_internal {
    internal();
};

# 2. Системные логи (от ОС Ubuntu)
source s_system {
    system();
};

# 3. Сетевые логи (от других узлов: FreeBSD, Proxmox, и других контейнеров)
source s_network_udp {
    udp(ip(0.0.0.0) port(514));
};

source s_network_tcp {
    tcp(ip(0.0.0.0) port(601));
};

# ===================================
# DESTINATIONS — куда писать логи
# ===================================

# Основной файл логов (все вместе)
destination d_all_logs {
    file("/var/log/syslog-ng/syslog"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# По хостам (каждый узел в отдельную папку)
destination d_per_host {
    file("/var/log/syslog-ng/hosts/$HOST/$PROGRAM.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# По программам (guacamole, postgres, haproxy и т.д.)
destination d_per_program {
    file("/var/log/syslog-ng/programs/$PROGRAM.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# ОШИБКИ в отдельный файл (для быстрого поиска проблем)
destination d_errors {
    file("/var/log/syslog-ng/errors.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# Guacamole сессии (отдельно)
destination d_guacamole {
    file("/var/log/syslog-ng/services/guacamole.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# HAProxy (отдельно, для анализа балансировки)
destination d_haproxy {
    file("/var/log/syslog-ng/services/haproxy.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# Proxmox (отдельно, для анализа ВМ)
destination d_proxmox {
    file("/var/log/syslog-ng/services/proxmox.log"
        perm(0644)
        dir_perm(0755)
        create_dirs(yes)
    );
};

# ===================================
# FILTERS — фильтры логов
# ===================================

# Ошибки и предупреждения
filter f_errors {
    level(err .. alert);
};

# По хостам
filter f_freebsd {
    host("10.0.10.1");
};

filter f_proxmox {
    host("10.0.10.2");
};

filter f_docker {
    host("10.0.10.3");
};

# По программам
filter f_guacamole {
    program("guacamole");
};

filter f_haproxy {
    program("haproxy");
};

filter f_postgres {
    program("postgres");
};

filter f_proxmox_pve {
    program("pve");
};

# ===================================
# LOG PATHS — правила логирования
# ===================================

# Все логи везде
log {
    source(s_internal);
    source(s_system);
    source(s_network_udp);
    source(s_network_tcp);
    destination(d_all_logs);
    destination(d_per_host);
    destination(d_per_program);
};

# ОШИБКИ в отдельный файл
log {
    source(s_internal);
    source(s_system);
    source(s_network_udp);
    source(s_network_tcp);
    filter(f_errors);
    destination(d_errors);
};

# Guacamole
log {
    source(s_network_udp);
    source(s_network_tcp);
    filter(f_guacamole);
    destination(d_guacamole);
};

# HAProxy
log {
    source(s_network_udp);
    source(s_network_tcp);
    filter(f_haproxy);
    destination(d_haproxy);
};

# Proxmox
log {
    source(s_network_udp);
    source(s_network_tcp);
    filter(f_proxmox);
    destination(d_proxmox);
};

# ===================================
# OPTIONS (глобальные настройки)
# ===================================

options {
    # Временная зона
    time_zone("Europe/Moscow");
    
    # Размер буфера для обработки
    log_fifo_size(1000);
    
    # Использование full timestamp (с микросекундами)
    ts_format(rfc3164);
    
    # Не запускать в fork-режиме (нужен для контейнера)
    daemon(no);
    
    # Статистика каждые 10 минут
    stats_freq(600);
};