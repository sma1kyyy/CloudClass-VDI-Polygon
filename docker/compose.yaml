services:

  postgres:
    image: postgres:16
    container_name: guac-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./guacamole/init:/docker-entrypoint-initdb.d

    mem_limit: 256m

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "postgres"

    networks:
      - cloudclass

  guacd:
    image: guacamole/guacd:${GUACAMOLE_VERSION}
    container_name: guacd
    restart: unless-stopped

    mem_limit: 256m

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "guacd"

    networks:
      - cloudclass

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION}
    container_name: guacamole
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy

    environment:
      GUACD_HOSTNAME: guacd

      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8080:8080"

    mem_limit: 512m

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/guacamole"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "guacamole"

    networks:
      - cloudclass

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    ports:
      - "9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    mem_limit: 256m

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "portainer"

    networks:
      - cloudclass

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Moscow
      PASSWORD: ${CODE_SERVER_PASSWORD}

    ports:
      - "8443:8443"

    volumes:
      - code_server_data:/config

    mem_limit: 512m

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "code-server"

    networks:
      - cloudclass

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

    mem_limit: 512m

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "prometheus"

    networks:
      - cloudclass

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana

    mem_limit: 256m

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "grafana"

    networks:
      - cloudclass

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

    command:
      - '--path.rootfs=/host'

    volumes:
      - '/:/host:ro,rslave'

    mem_limit: 128m

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - cloudclass

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped

    ports:
      - "8081:8080"

    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    mem_limit: 256m

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "cadvisor"

    networks:
      - cloudclass

  # ========== ЛОГИРОВАНИЕ ==========
  syslog-ng:
    image: balabit/syslog-ng:latest
    container_name: syslog-ng
    restart: unless-stopped

    ports:
      - "514:514/udp"    # Приём от других узлов (FreeBSD, Proxmox)
      - "601:601/tcp"    # Альтернативный TCP порт

    volumes:
      - ./syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf
      - syslog_data:/var/log/syslog-ng

    mem_limit: 256m

    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/syslog-ng/syslog"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - cloudclass

  # ========== ALERTMANAGER ==========
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager

    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

    mem_limit: 128m

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: syslog
      options:
        syslog-address: "udp://127.0.0.1:514"
        syslog-facility: local0
        tag: "alertmanager"

    networks:
      - cloudclass

volumes:
  postgres_data:
  portainer_data:
  code_server_data:
  prometheus_data:
  grafana_data:
  syslog_data:
  alertmanager_data:

networks:
  cloudclass:
    driver: bridge